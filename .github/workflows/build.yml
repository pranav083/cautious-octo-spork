name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile every example
        run: |
          set -e
          for f in $(find fundamentals recursion oop file-io -name '*.cpp'); do
            echo "compiling $f"
            g++ -std=c++17 -Wall -Wextra -o /tmp/out "$f"
          done
